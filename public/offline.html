<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D4AF37">
  <title>Hors ligne - Nubia Aura</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fffbf5;
      color: #121212;
      font-family: Inter, Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 420px);
    }

    .mark {
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border: 2px solid #d4af37;
      border-radius: 999px;
      background: #0b0b0b;
      color: #f7dc75;
      font-family: Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    h1 {
      margin-bottom: 12px;
      font-family: Georgia, serif;
      font-size: clamp(32px, 9vw, 48px);
      line-height: 1;
    }

    p {
      margin: 0 auto 24px;
      color: rgba(18, 18, 18, 0.72);
      font-size: 16px;
      line-height: 1.65;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      background: #d4af37;
      color: #0b0b0b;
      cursor: pointer;
      font: 700 16px/1 Inter, Arial, sans-serif;
      padding: 14px 22px;
    }

    button:focus-visible {
      outline: 3px solid rgba(212, 175, 55, 0.38);
      outline-offset: 3px;
    }

    .status {
      margin-top: 20px;
      font-size: 13px;
      color: rgba(18, 18, 18, 0.56);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">NA</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Votre connexion internet semble indisponible. Les pages déjà ouvertes peuvent rester accessibles.</p>
    <button type="button" onclick="window.location.reload()">Réessayer</button>
    <p class="status" id="status">En attente de connexion...</p>
  </main>

  <script>
    window.addEventListener('online', function () {
      document.getElementById('status').textContent = 'Connexion rétablie. Rechargement...';
      setTimeout(function () {
        window.location.reload();
      }, 900);
    });

    window.addEventListener('offline', function () {
      document.getElementById('status').textContent = 'En attente de connexion...';
    });
  </script>
</body>
</html>
